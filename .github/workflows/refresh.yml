name: Refresh Roblox stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull fresh Roblox stats and regenerate index.html
        run: python scripts/refresh.py

      - name: Commit and push if index.html changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No stat changes, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-refresh Roblox stats $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
